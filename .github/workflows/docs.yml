name: docs

# Publishes docs/ to GitHub Pages. Inert until Pages is enabled for this repo
# (Settings → Pages → Source: GitHub Actions). On the Free plan that also
# requires the repository to be public.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      # blume's CLI runs on Node (>=22.12); bun is only the package manager.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        # A project site is served from /<repo>; local dev serves from the root.
        env:
          BASE_PATH: /dag-plugin
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  # Deploy only on a manual run. Pages is not enabled for this repo yet — and on the
  # Free plan it cannot be while the repo is private — so deploying on every push
  # would fail every time. The build above still runs on push, which is the part
  # worth having: it catches docs that stop compiling.
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
